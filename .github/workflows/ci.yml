name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Chondrite.Store.slnx
      - name: Build
        run: dotnet build Chondrite.Store.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test --solution Chondrite.Store.slnx --configuration Release --no-build
      - name: Pack smoke test
        run: dotnet pack src/Chondrite.Store/Chondrite.Store.csproj --configuration Release --no-build --output artifacts /p:PackageVersion=0.0.0-ci
      - name: Verify package in a consuming project
        run: python scripts/package-smoke.py --package artifacts/Chondrite.Store.0.0.0-ci.nupkg
